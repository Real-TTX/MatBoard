# MatBoard - Local (builds the image from this folder) with pgAdmin
#   ./scripts/redeploy.ps1              (rebuilds and starts the stack: the way to test every change)
#   docker compose -f docker-compose.local.yml up -d --build
#   App:      http://localhost:3945
#   pgAdmin:  http://localhost:3946   (no sign-in; database password: matboard)
#   Postgres: localhost:3947          (for "dotnet run" outside Docker, see appsettings.Development.json)
name: matboard-local

services:
  web:
    build: .
    image: matboard:local
    restart: unless-stopped
    ports:
      - "3945:3945"
    volumes:
      - web-data:/data
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17
    restart: unless-stopped
    ports:
      - "3947:5432"
    environment:
      POSTGRES_DB: matboard
      POSTGRES_USER: matboard
      POSTGRES_PASSWORD: matboard
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U matboard -d matboard"]
      interval: 5s
      timeout: 5s
      retries: 20

  pgadmin:
    image: dpage/pgadmin4:latest
    restart: unless-stopped
    ports:
      - "3946:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@matboard.example.com
      PGADMIN_DEFAULT_PASSWORD: matboard
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
    configs:
      - source: servers
        target: /pgadmin4/servers.json
    volumes:
      - pgadmin-data:/var/lib/pgadmin
    depends_on:
      - db

configs:
  servers:
    content: |
      {"Servers": {"1": {"Name": "MatBoard (local)", "Group": "Servers", "Host": "db", "Port": 5432, "MaintenanceDB": "matboard", "Username": "matboard", "SSLMode": "prefer"}}}

volumes:
  web-data:
  db-data:
  pgadmin-data:

# A fixed subnet: on a machine with many stacks Docker runs out of address pools otherwise
# ("all predefined address pools have been fully subnetted").
networks:
  default:
    ipam:
      config:
        - subnet: 10.253.94.0/24
