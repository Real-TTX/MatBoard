# MatBoard - Release (branch main, image :latest)
#   docker compose up -d        ->  http://localhost:3945
# The first account that registers is the administrator. No variable is needed: MatBoard does its whole job without them.
# Mattiverse connects the rest by itself (see README); Administration -> Connections shows what is connected.
name: matboard

services:
  web:
    image: ghcr.io/real-ttx/matboard:latest
    restart: unless-stopped
    ports:
      - "3945:3945"
    volumes:
      - web-data:/data
    # Optional, none of them is needed; Mattiverse sets them when it installs MatBoard:
    # environment:
    #   MAT_API_KEY: ""                    # the key of /api/* (platform contract)
    #   MAT_PUBLIC_URL: ""                 # https://board.example.com: public address (links, mails); fixed on Administration -> System while set
    #   MAT_FRAME_ANCESTORS: ""            # origins that may show MatBoard in a frame (Mattiverse)
    #   MATIDENTITY_AUTHORITY: ""          # https://id.example.com: sign-in through MatIdentity (identity.oidc)
    #   MATIDENTITY_CLIENT_ID: "matboard"
    #   MATIDENTITY_CLIENT_SECRET: ""
    #   MATIDENTITY_INTERNAL_URL: ""       # http://matidentity:2300 inside Docker
    #   MATSMTP_HOST: ""                   # mail about shared boards through MatSMTP (mail.smtp)
    #   MATSMTP_PORT: "2025"
    #   MATSMTP_USERNAME: "matboard"
    #   MATSMTP_PASSWORD: ""
    #   MATSMTP_FROM: ""
    #   MATSMTP_TLS: "none"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: matboard
      POSTGRES_USER: matboard
      POSTGRES_PASSWORD: matboard
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U matboard -d matboard"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  web-data:
  db-data:
