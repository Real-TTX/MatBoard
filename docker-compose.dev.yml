# MatBoard - Development (branch dev, image :nightly) with pgAdmin
#   docker compose -f docker-compose.dev.yml up -d
#   App:     http://localhost:3945
#   pgAdmin: http://localhost:3946   (no sign-in; database password: matboard)
name: matboard-dev

services:
  web:
    image: ghcr.io/real-ttx/matboard:nightly
    restart: unless-stopped
    ports:
      - "3945:3945"
    volumes:
      - web-data:/data
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: matboard
      POSTGRES_USER: matboard
      POSTGRES_PASSWORD: matboard
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U matboard -d matboard"]
      interval: 5s
      timeout: 5s
      retries: 20

  pgadmin:
    image: dpage/pgadmin4:latest
    restart: unless-stopped
    ports:
      - "3946:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@matboard.example.com
      PGADMIN_DEFAULT_PASSWORD: matboard
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
    configs:
      - source: servers
        target: /pgadmin4/servers.json
    volumes:
      - pgadmin-data:/var/lib/pgadmin
    depends_on:
      - db

configs:
  servers:
    content: |
      {"Servers": {"1": {"Name": "MatBoard", "Group": "Servers", "Host": "db", "Port": 5432, "MaintenanceDB": "matboard", "Username": "matboard", "SSLMode": "prefer"}}}

volumes:
  web-data:
  db-data:
  pgadmin-data:
